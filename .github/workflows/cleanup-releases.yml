name: Cleanup old releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases (keep last 10)
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 10;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Sorted newest-first by default
            const toDelete = releases.slice(KEEP);

            for (const release of toDelete) {
              console.log(`Deleting release ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              // Also delete the git tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`Deleted tag ${release.tag_name}`);
              } catch (e) {
                console.log(`Tag ${release.tag_name} already gone`);
              }
            }

            console.log(`Kept ${Math.min(releases.length, KEEP)} releases, deleted ${toDelete.length}`);
